# API Service Values 
# File: helm/applications/api-service/values.yaml

app-template:
  replicaCount: 2
  
  image:
    repository: 123456789012.dkr.ecr.us-west-2.amazonaws.com/api-service
    pullPolicy: Always
    tag: "latest"
  
  service:
    type: ClusterIP
    port: 8080
  
  ingress:
    enabled: true
    annotations:
      kubernetes.io/ingress.class: nginx
    hosts:
      - host: api.dev.example.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: api-tls
        hosts:
          - api.dev.example.com
  
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 256Mi
  
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
  
  env:
    - name: NODE_ENV
      value: "development"
    - name: LOG_LEVEL
      value: "info"
  
  configMaps:
    - name: config
      data:
        API_TIMEOUT: "30"
        CACHE_TTL: "300"
        MAX_CONNECTIONS: "100"